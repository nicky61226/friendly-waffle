<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>光影遊戲 Light and Shadow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: composition-notebook marble frame, one white sticker-panel stage, scoreboard on top, one game view at a time. Single deliberate light look. */
:root {
  --ink: #1f1f1f;
  --paper: #ffffff;
  --cream: #fff6da;
  --pink: #ff8fb8;  --pink-l: #ffd6e5;
  --mint: #6ed8b9;  --mint-l: #d3f5ea;
  --sun: #ffd43b;   --sun-l: #fff1b8;
  --lilac: #b49cff; --lilac-l: #e4dbff;
  --sky: #6ec3ff;   --sky-l: #d4eeff;
  --peach: #ffa470; --peach-l: #ffe0cc;
  --muted: #55525e;
  --bad: #e23d6d;
  --display: "Lilita One", "Baloo 2", "Noto Sans TC", system-ui, sans-serif;
  --body: "Baloo 2", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --zh: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: #e9e9e9 var(--marble, none) center / cover;
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.frame { box-sizing: border-box; height: 100%; padding-inline: clamp(16px, 2.6vw, 34px); padding-block: clamp(12px, 2.4vw, 28px); display: flex; }
.stage {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: var(--paper); border: 5px solid var(--ink); border-radius: 30px;
  box-shadow: 0 6px 0 var(--ink); overflow: hidden; position: relative;
}
/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 22px 10px; }
.brand { font-family: var(--display); font-size: clamp(26px, 3.4vw, 40px); line-height: 1; letter-spacing: .5px; display: flex; gap: 1px; flex-wrap: wrap; }
.brand span { -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.teams { display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap; }
.team {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px;
  border: 3px solid var(--ink); border-radius: 18px; background: var(--paper);
  transition: transform .2s, box-shadow .2s;
}
.team.on { transform: translateY(-3px); box-shadow: 0 5px 0 var(--ink); }
.team[data-t="0"].on { background: var(--sky-l); }
.team[data-t="1"].on { background: var(--pink-l); }
.team input { width: 5.6em; font: 800 20px var(--body); border: 0; background: transparent; color: var(--ink); padding: 0; }
.team input:focus-visible { outline: 3px dashed var(--ink); border-radius: 6px; }
.score { font-family: var(--display); font-size: 38px; min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; }
.score.pop { animation: pop .5s; }
.mini { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.mini svg { width: 14px; height: 14px; }
.tools { display: flex; gap: 8px; }
.tool { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.tool svg { width: 20px; height: 20px; }
button:focus-visible { outline: 4px dashed var(--ink); outline-offset: 3px; }
.turn { font: 800 17px var(--body); padding: 2px 22px 0; color: var(--muted); }
.turn b { color: var(--ink); }
/* views */
.view { flex: 1; min-height: 0; overflow: auto; padding: 8px 22px 22px; display: flex; flex-direction: column; }
.btn {
  font: 800 clamp(20px, 2.3vw, 28px) var(--body); color: var(--ink);
  border: 3.5px solid var(--ink); border-radius: 20px; padding: .45em 1.1em .35em;
  background: var(--sun); box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  transition: transform .12s, box-shadow .12s; line-height: 1.15;
}
.btn small { display: block; font: 700 .62em var(--zh); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.zh { font-family: var(--zh); }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4vw, 48px); margin: 4px 0 2px; text-wrap: balance; }
h2 .zh { font: 900 .5em var(--zh); color: var(--muted); margin-left: .4em; }
/* menu */
.menu { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; align-content: center; max-width: 980px; width: 100%; margin: 0 auto; }
.gcard {
  border: 4px solid var(--ink); border-radius: 26px; padding: 24px; cursor: pointer; text-align: left;
  box-shadow: 0 7px 0 var(--ink); display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center;
  font-family: var(--body); color: var(--ink); transition: transform .12s, box-shadow .12s;
}
.gcard:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.gcard .ic { grid-row: span 2; width: 96px; height: 96px; border-radius: 50%; border: 3.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; }
.gcard .ic svg { width: 52px; height: 52px; }
.gcard b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
.gcard span { font: 700 19px var(--zh); color: var(--ink); }
.gcard p { grid-column: 1 / -1; margin: 10px 0 0; font: 600 17px var(--zh); color: var(--muted); }
.hint { text-align: center; font: 600 15px var(--zh); color: var(--muted); margin-top: 18px; }
/* big or small */
.q { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: center; flex: 1; }
@media (max-width: 760px) { .q { grid-template-columns: 1fr; } }
.scene { width: 100%; max-width: 100%; aspect-ratio: 640 / 300; border: 3.5px solid var(--ink); border-radius: 22px; background: #f4f1ff; }
.prompt { font: 800 clamp(24px, 2.8vw, 34px) var(--body); line-height: 1.2; margin: 0; text-wrap: balance; }
.prompt .zh { display: block; font: 700 .62em var(--zh); color: var(--muted); margin-top: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; }
.opts .btn { min-width: 6.5em; }
.btn.wrong { background: #eee; color: #888; text-decoration: line-through; box-shadow: 0 2px 0 #888; border-color: #888; animation: shake .4s; }
.btn.right { background: var(--mint); }
.feedback { min-height: 3.2em; margin-top: 16px; font: 800 24px var(--body); }
.feedback .zh { display: block; font: 700 17px var(--zh); color: var(--muted); }
.feedback.bad { color: var(--bad); }
.progress { display: flex; gap: 8px; align-items: center; font: 800 16px var(--body); color: var(--muted); }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); }
.dot.done { background: var(--mint); }
.dot.now { background: var(--sun); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.shadowgrow { transform-box: fill-box; transform-origin: center; animation: grow .9s cubic-bezier(.2,1.4,.4,1) both; }
.barGrow { transform-box: fill-box; transform-origin: left center; animation: growX .9s cubic-bezier(.2,1.2,.4,1) both; }
/* mystery box */
.boxes { flex: 1; min-height: 260px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(64px, 1fr)); gap: clamp(10px, 1.8vw, 20px); max-width: 860px; width: 100%; margin: 6px auto 4px; }
.box {
  max-width: 100%; border: 4px solid var(--ink); border-radius: 22px; cursor: pointer;
  font-family: var(--display); font-size: clamp(36px, 5vw, 64px); color: var(--ink);
  box-shadow: 0 6px 0 var(--ink); display: grid; place-items: center; position: relative; transition: transform .12s, box-shadow .12s;
}
.box:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
.box.open { background: var(--paper) !important; box-shadow: none; transform: none; cursor: default; border-style: dashed; color: var(--muted); }
.box.open .pz { font-size: .6em; display: flex; align-items: center; gap: .25em; }
.box.open .pz svg { width: .8em; height: .8em; }
.box .who { position: absolute; bottom: 6px; right: 12px; font: 800 14px var(--body); color: var(--muted); }
/* modal */
.modal { position: absolute; inset: 0; background: rgba(31,31,31,.55); display: grid; place-items: center; padding: 20px; z-index: 5; }
.card {
  background: var(--paper); border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink);
  width: min(820px, 100%); max-height: 100%; overflow: auto; padding: 22px 26px 26px; box-sizing: border-box;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 26px; align-items: center; animation: pop .35s;
}
.card .big { width: clamp(110px, 16vw, 170px); height: clamp(110px, 16vw, 170px); border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; grid-row: span 3; }
.card .big svg { width: 56%; height: 56%; }
.card h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; color: var(--muted); }
.card .ans { font: 800 clamp(28px, 3.4vw, 40px) var(--body); color: #0d8a64; }
.card .ans .zh { font: 700 .55em var(--zh); color: var(--muted); margin-left: .4em; }
.card .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-end; margin-top: 8px; }
.prize { display: flex; align-items: center; gap: 14px; font-family: var(--display); font-size: 54px; animation: pop .5s; }
.prize .coin { width: 84px; height: 84px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center; }
.prize .coin svg { width: 46px; height: 46px; }
.prize small { font: 800 20px var(--zh); color: var(--muted); }
.btn.ok { background: var(--mint); }
.btn.no { background: var(--pink); }
.btn.plain { background: var(--paper); }
/* end */
.end { flex: 1; display: grid; place-items: center; text-align: center; }
.end .trophy { width: 130px; height: 130px; margin: 0 auto 10px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun); display: grid; place-items: center; animation: pop .6s; }
.end .trophy svg { width: 64px; height: 64px; }
.end h2 { font-size: clamp(36px, 5vw, 60px); }
canvas#fx { position: absolute; inset: 0; pointer-events: none; z-index: 9; width: 100%; height: 100%; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 8; pointer-events: none; font-family: var(--display); font-size: clamp(34px, 5vw, 62px); padding: 10px 34px; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 7px 0 var(--ink); white-space: nowrap; animation: bannerIn 1.4s both; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -8px; } 75% { translate: 8px; } }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 15%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
@media (max-width: 600px) { .bar { padding: 12px 14px 6px; } .view { padding: 6px 14px 16px; } .team input { width: 4.2em; font-size: 17px; } .score { font-size: 30px; } }
</style>

<style>html,body{margin:0}</style>

const I = n => ICONS[n];
// ---------- marble background (composition notebook) ----------
(function marble() {
  try {
    const W = 960, H = 600, c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    const acc = new Float32Array(W * H);
    [[12, .5], [26, 1], [52, .6]].forEach(([sc, wt]) => {
      const sw = Math.ceil(W / sc) + 2, sh = Math.ceil(H / sc) + 2;
      const s = document.createElement("canvas"); s.width = sw; s.height = sh;
      const sg = s.getContext("2d"), id = sg.createImageData(sw, sh);
      for (let i = 0; i < sw * sh; i++) { const v = Math.random() * 255; id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v; id.data[i*4+3] = 255; }
      sg.putImageData(id, 0, 0);
      g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
      g.drawImage(s, -sc, -sc, sw * sc, sh * sc);
      const d = g.getImageData(0, 0, W, H).data;
      for (let i = 0; i < W * H; i++) acc[i] += d[i*4] / 255 * wt;
    });
    const sorted = Float32Array.from(acc).sort(), t = sorted[Math.floor(sorted.length / 2)];
    const out = g.createImageData(W, H);
    for (let i = 0; i < W * H; i++) { const v = acc[i] > t ? 30 : 255; out.data[i*4] = out.data[i*4+1] = out.data[i*4+2] = v; out.data[i*4+3] = 255; }
    g.putImageData(out, 0, 0);
    document.body.style.setProperty("--marble", `url(${c.toDataURL()})`);
  } catch (e) {}
})();

// ---------- brand ----------
const RAIN = ["#ff6fa5", "#ffb000", "#3cc9a0", "#4faef5", "#a07cff", "#ff8a4c"];
document.getElementById("brand").innerHTML = Array.from("Light & Shadow").map((ch, i) => ch === " " ? "<span>&nbsp;</span>" : `<span style="color:${RAIN[i % 6]}">${ch}</span>`).join("");
document.querySelectorAll("[data-adj]").forEach(b => b.innerHTML = I(b.textContent.trim().replace(/__I_|__/g, "")) || b.innerHTML);
document.querySelectorAll(".tool").forEach(b => { const m = b.textContent.match(/__I_(\w+)__/); if (m) b.innerHTML = I(m[1]); });

// ---------- state ----------
let S = { scores: [0, 0], turn: 0, sound: true, view: "menu", bos: null, mb: null };
const $ = id => document.getElementById(id);
const view = $("view");
function teamName(t) { return ($("team" + t).value || ("Team " + (t + 1))).trim(); }
function renderScores(popT) {
  [0, 1].forEach(t => {
    const el = $("score" + t); el.textContent = S.scores[t];
    if (t === popT) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  });
  document.querySelectorAll(".team").forEach(el => el.classList.toggle("on", +el.dataset.t === S.turn));
  $("turn").innerHTML = S.view === "menu" ? "點一個遊戲開始。兩隊輪流上台，答對自動加分。" : `Now playing 輪到：<b>${esc(teamName(S.turn))}</b>`;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function addScore(t, n) { S.scores[t] += n; renderScores(t); }
function nextTurn() { S.turn = 1 - S.turn; renderScores(); banner(teamName(S.turn) + "!", S.turn ? "var(--pink)" : "var(--sky)"); }
document.querySelectorAll("[data-adj]").forEach(b => b.addEventListener("click", () => { const [t, n] = b.dataset.adj.split(",").map(Number); addScore(t, n); }));
[0, 1].forEach(t => $("team" + t).addEventListener("input", () => renderScores()));
document.querySelectorAll(".team").forEach(el => el.addEventListener("click", e => { if (e.target.closest("button,input")) return; S.turn = +el.dataset.t; renderScores(); }));

// ---------- sound ----------
let AC = null;
function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d, type]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d * .85;
    });
  } catch (e) {}
}
const SFX = {
  ok: () => tone([[660, .12], [880, .12], [1320, .25]]),
  no: () => tone([[220, .18, "square"], [180, .25, "square"]]),
  tap: () => tone([[520, .07]]),
  win: () => tone([[523, .14], [659, .14], [784, .14], [1047, .4]]),
  boo: () => tone([[300, .2, "sawtooth"], [240, .2, "sawtooth"], [180, .35, "sawtooth"]]),
};
$("snd").addEventListener("click", () => { S.sound = !S.sound; $("snd").innerHTML = I(S.sound ? "FaVolumeUp" : "FaVolumeMute"); if (S.sound) SFX.tap(); });
$("fs").addEventListener("click", async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) {} });
$("home").addEventListener("click", () => go("menu"));

// ---------- effects ----------
const fx = $("fx"), fxg = fx.getContext("2d"); let parts = [], raf = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti() {
  if (reduce) return;
  const r = fx.getBoundingClientRect(); fx.width = r.width; fx.height = r.height;
  for (let i = 0; i < 120; i++) parts.push({ x: r.width / 2, y: r.height * .45, vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4, s: 6 + Math.random() * 8, c: RAIN[i % 6], r: Math.random() * 6, life: 90 });
  if (!raf) loop();
}
function loop() {
  fxg.clearRect(0, 0, fx.width, fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.r += .2; p.life--; fxg.save(); fxg.translate(p.x, p.y); fxg.rotate(p.r); fxg.fillStyle = p.c; fxg.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fxg.restore(); });
  parts = parts.filter(p => p.life > 0);
  raf = parts.length ? requestAnimationFrame(loop) : (fxg.clearRect(0, 0, fx.width, fx.height), 0);
}
function banner(text, bg) {
  const b = document.createElement("div"); b.className = "banner"; b.textContent = text; b.style.background = bg;
  $("stage").appendChild(b); setTimeout(() => b.remove(), 1500);
}

// ---------- views ----------
function go(v) {
  S.view = v; renderScores();
  if (v === "menu") return menu();
  if (v === "bos") { if (!S.bos || S.bos.done) S.bos = newBos(); return bos(); }
  if (v === "mb") { if (!S.mb) S.mb = newMb(); return mb(); }
}
function menu() {
  view.innerHTML = `
    <div class="menu">
      <button class="gcard" style="background:var(--lilac-l)" data-go="bos">
        <div class="ic" style="background:var(--sun)">${I("FaLightbulb")}</div>
        <b>Big or small?</b><span>影子大挑戰</span>
        <p>光靠近、離遠、在高處、在低處，影子會怎麼變？答對就看影子長出來。</p>
      </button>
      <button class="gcard" style="background:var(--mint-l)" data-go="mb">
        <div class="ic" style="background:var(--pink)">${I("FaGift")}</div>
        <b>Mystery Box</b><span>神秘箱</span>
        <p>選一個箱子回答問題，答對才能打開。小心 Shadow monster 會扣分！</p>
      </button>
    </div>
    <div class="hint">隊名可以直接點一下修改。點上方隊伍可以手動換人；旁邊的 + − 可以手動調分數。</div>`;
  view.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { SFX.tap(); go(b.dataset.go); }));
}

// ===== Game 1: Big or small =====
const BOS = [
  { k: "near", en: "When the light is near, the shadow is…", zh: "光靠近，影子會變得？", opts: [["big", "大"], ["small", "小"]], a: 0,
    say: "When the light is near, the shadow is big.", sayZh: "光靠近，影子變大。" },
  { k: "far", en: "When the light is far, the shadow is…", zh: "光離遠，影子會變得？", opts: [["big", "大"], ["small", "小"]], a: 1,
    say: "When the light is far, the shadow is small.", sayZh: "光離遠，影子變小。" },
  { k: "high", en: "When the light is high, the shadow is…", zh: "光在高處，影子會變得？", opts: [["long", "長"], ["short", "短"]], a: 1,
    say: "When the light is high, the shadow is short.", sayZh: "光在高處，影子變短。" },
  { k: "low", en: "When the light is low, the shadow is…", zh: "光在低處，影子會變得？", opts: [["long", "長"], ["short", "短"]], a: 0,
    say: "When the light is low, the shadow is long.", sayZh: "光在低處，影子變長。" },
  { k: "off", en: "Turn off the light. Can we see a shadow?", zh: "把燈關掉，還看得到影子嗎？", opts: [["Yes", "看得到"], ["No", "看不到"]], a: 1,
    say: "No light, no shadow!", sayZh: "沒有光，就沒有影子！" },
  { k: "screen", en: "We need light, a puppet, and a…", zh: "演皮影戲，要有光、偶，還要有？", opts: [["screen", "布幕"], ["cup", "杯子"]], a: 0,
    say: "We need a screen to show the shadow.", sayZh: "要有布幕，影子才看得到。" },
];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newBos() { return { order: [0, 1, 2, 3, 4, 5], i: 0, tries: 0, solved: false, done: false }; }
function svgIcon(name, x, y, size, fill) { return I(name).replace("<svg", `<svg x="${x}" y="${y}" width="${size}" height="${size}" style="color:${fill}"`); }
function lamp(x, y, on = true) {
  return `<circle cx="${x}" cy="${y}" r="32" fill="${on ? "#ffd43b" : "#bdbdbd"}" stroke="#1f1f1f" stroke-width="4"/>` + svgIcon("FaLightbulb", x - 17, y - 17, 34, "#1f1f1f");
}
function scene(k, solved) {
  const ink = "#1f1f1f";
  let s = `<svg viewBox="0 0 640 300" class="scene" role="img" aria-label="light and shadow picture">`;
  if (k === "near" || k === "far" || k === "screen" || k === "off") {
    const lx = k === "near" ? 250 : k === "far" ? 70 : 150, on = k !== "off";
    const sc = k === "near" ? 1.55 : k === "far" ? .62 : 1;
    const dark = k === "off";
    if (dark) s += `<rect x="0" y="0" width="640" height="300" rx="18" fill="#4b4766"/>`;
    const showScreen = k !== "screen" || solved;
    s += showScreen
      ? `<rect x="452" y="30" width="160" height="240" rx="8" fill="${dark ? "#6d6888" : "#fff6da"}" stroke="${ink}" stroke-width="4"/>`
      : `<rect x="452" y="30" width="160" height="240" rx="8" fill="none" stroke="${ink}" stroke-width="4" stroke-dasharray="14 10"/><text x="532" y="172" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="70" fill="#9a9a9a">?</text>`;
    if (on) s += `<polygon points="${lx},150 452,${150 - 95 * sc} 452,${150 + 95 * sc}" fill="#ffd43b" opacity=".28"/>`;
    s += `<line x1="330" y1="178" x2="330" y2="250" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>` + svgIcon("GiRabbit", 300, 118, 64, "#b49cff");
    s += lamp(lx, 150, on);
    s += `<text x="${lx}" y="210" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="20" fill="${dark ? "#fff" : ink}">${k === "near" ? "near 近" : k === "far" ? "far 遠" : k === "off" ? "off 關燈" : "light 光"}</text>`;
    if (k !== "screen" || solved) {
      if (solved && on) { const sz = 70 * sc; s += `<g class="shadowgrow">${svgIcon("GiRabbit", 532 - sz / 2, 150 - sz / 2, sz, "#111")}</g>`; }
      else if (!solved) s += `<text x="532" y="172" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="70" fill="${dark ? "#c9c5e6" : "#9a9a9a"}">?</text>`;
      else s += `<text x="532" y="160" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="22" fill="#fff">no shadow</text>`;
    }
  } else {
    const high = k === "high";
    const lx = high ? 300 : 70, ly = high ? 46 : 205;
    s += `<rect x="0" y="246" width="640" height="54" fill="#d3f5ea"/><line x1="0" y1="246" x2="640" y2="246" stroke="${ink}" stroke-width="4"/>`;
    s += lamp(lx, ly);
    s += `<text x="${high ? 360 : 70}" y="${high ? 52 : 160}" text-anchor="${high ? "start" : "middle"}" font-family="Baloo 2, sans-serif" font-weight="800" font-size="20" fill="${ink}">${high ? "high 高" : "low 低"}</text>`;
    const len = high ? 46 : 250;
    if (solved) s += `<rect class="barGrow" x="312" y="238" width="${len}" height="16" rx="8" fill="#111" opacity=".8"/>`;
    else s += `<text x="420" y="232" font-family="Lilita One, sans-serif" font-size="54" fill="#9a9a9a">?</text>`;
    s += svgIcon("FaChild", 268, 128, 120, "#6ec3ff");
  }
  return s + "</svg>";
}
function bos() {
  const g = S.bos, q = BOS[g.order[g.i]];
  if (g.done) return endScreen("bos");
  view.innerHTML = `
    <div class="row">
      <h2>Big or small?<span class="zh">影子大挑戰</span></h2>
      <div class="progress">${g.order.map((_, j) => `<span class="dot ${j < g.i ? "done" : j === g.i ? "now" : ""}"></span>`).join("")}<span>${g.i + 1}/${g.order.length}</span></div>
    </div>
    <div class="q">
      <div id="scn">${scene(q.k, g.solved)}</div>
      <div>
        <p class="prompt">${q.en}<span class="zh">${q.zh}</span></p>
        <div class="opts" id="opts">${q.opts.map((o, j) => `<button class="btn" data-j="${j}" style="background:${["var(--sky)", "var(--pink)"][j]}">${o[0]}<small>${o[1]}</small></button>`).join("")}</div>
        <div class="feedback" id="fb"></div>
        <div id="nx"></div>
      </div>
    </div>`;
  view.querySelectorAll("#opts .btn").forEach(b => b.addEventListener("click", () => answerBos(+b.dataset.j, b)));
  if (g.solved) showSolved(q, false);
}
function answerBos(j, b) {
  const g = S.bos, q = BOS[g.order[g.i]];
  if (g.solved || b.classList.contains("wrong")) return;
  if (j !== q.a) {
    g.tries++; b.classList.add("wrong"); SFX.no();
    $("fb").className = "feedback bad"; $("fb").innerHTML = `Oops! Try again.<span class="zh">再想一想，再試一次！</span>`;
    return;
  }
  g.solved = true; SFX.ok(); confetti();
  const pts = g.tries === 0 ? 1 : 0;
  if (pts) addScore(S.turn, pts);
  $("scn").innerHTML = scene(q.k, true);
  showSolved(q, true, pts);
}
function showSolved(q, fresh, pts) {
  const g = S.bos;
  view.querySelectorAll("#opts .btn").forEach((b, j) => { if (j === q.a) b.classList.add("right"); });
  $("fb").className = "feedback";
  $("fb").innerHTML = `${q.say}<span class="zh">${q.sayZh}${fresh ? (pts ? `　${esc(teamName(S.turn))} +1` : "　（第二次才答對，這題不加分）") : ""}</span>`;
  $("nx").innerHTML = `<button class="btn" id="next" style="background:var(--sun)">${g.i + 1 < g.order.length ? "Next ▶" : "Finish ▶"}<small>${g.i + 1 < g.order.length ? "下一題" : "看結果"}</small></button>`;
  $("next").addEventListener("click", () => {
    SFX.tap(); g.i++; g.tries = 0; g.solved = false;
    if (g.i >= g.order.length) { g.done = true; return endScreen("bos"); }
    nextTurn(); bos();
  });
}

// ===== Game 2: Mystery box =====
const MB = [
  { ic: "FaSun", q: "What is it?", qz: "這是什麼？", a: "light", az: "光" },
  { ic: "GiFlashlight", q: "What is it?", qz: "這是什麼？", a: "flashlight", az: "手電筒" },
  { ic: "GiTheaterCurtains", q: "What is it?", qz: "這是什麼？", a: "screen", az: "布幕" },
  { ic: "GiPuppet", q: "What is it?", qz: "這是什麼？", a: "puppet", az: "偶" },
  { ic: "FaMoon", q: "Turn off the lights. It is ___.", qz: "關燈以後，變得___。", a: "dark", az: "暗暗的" },
  { ic: "FaHandPaper", q: "We make hand shadows with our ___.", qz: "手影是用什麼做的？", a: "hands", az: "手" },
  { ic: "GiRabbit", q: "What animal is it?", qz: "這是什麼動物的手影？", a: "It's a rabbit.", az: "是兔子。", shadow: true },
  { ic: "GiTheaterCurtains", q: "Shadow play: Where is the light?", qz: "皮影戲的燈在哪裡？", a: "Behind the screen.", az: "在布幕後面。" },
  { ic: "FaChild", q: "I follow you. I am dark. What am I?", qz: "猜猜我是誰？", a: "your shadow", az: "你的影子", shadow: true },
];
const PRIZES = [[1, "FaStar"], [1, "FaStar"], [2, "FaStar"], [2, "FaStar"], [3, "FaStar"], [3, "FaStar"], [5, "FaGift"], [-1, "FaGhost"], [-1, "FaGhost"]];
const BOXC = ["var(--pink)", "var(--mint)", "var(--sun)", "var(--lilac)", "var(--sky)", "var(--peach)", "var(--pink)", "var(--mint)", "var(--sun)"];
const LIGHT = ["var(--pink-l)", "var(--mint-l)", "var(--sun-l)", "var(--lilac-l)", "var(--sky-l)", "var(--peach-l)", "var(--pink-l)", "var(--mint-l)", "var(--sun-l)"];
function newMb() { return { prizes: shuffle(PRIZES), open: {}, cur: null }; }
function mb() {
  const g = S.mb;
  const left = 9 - Object.keys(g.open).length;
  if (!left) return endScreen("mb");
  view.innerHTML = `
    <div class="row">
      <h2>Mystery Box<span class="zh">神秘箱</span></h2>
      <div class="progress">還剩 ${left} 個箱子</div>
    </div>
    <div class="boxes">${MB.map((_, i) => {
      const o = g.open[i];
      if (o) { const [v, ic] = g.prizes[i]; return `<div class="box open" aria-label="box ${i + 1} opened"><span class="pz" style="color:${v < 0 ? "var(--bad)" : "var(--ink)"}">${I(ic)}${v > 0 ? "+" + v : v}</span><span class="who">${esc(o)}</span></div>`; }
      return `<button class="box" data-i="${i}" style="background:${BOXC[i]}">${i + 1}</button>`;
    }).join("")}</div>`;
  view.querySelectorAll("button.box").forEach(b => b.addEventListener("click", () => { SFX.tap(); openQ(+b.dataset.i); }));
  if (g.cur !== null) openQ(g.cur);
}
function modal(html) {
  closeModal();
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal"; m.innerHTML = `<div class="card">${html}</div>`;
  $("stage").appendChild(m); return m;
}
function closeModal() { const m = $("modal"); if (m) m.remove(); }
function openQ(i, stage = "q") {
  const g = S.mb, it = MB[i]; g.cur = i;
  const big = `<div class="big" style="background:${it.shadow ? "#fff6da" : LIGHT[i]};color:${it.shadow ? "#111" : "var(--ink)"}">${I(it.ic)}</div>`;
  const head = `${big}<h3>Box ${i + 1}</h3><p class="prompt">${it.q}<span class="zh">${it.qz}</span></p>`;
  let m;
  if (stage === "q") {
    m = modal(`${head}<div></div><div class="acts"><button class="btn plain" id="back">◀ Back<small>回箱子</small></button><button class="btn" id="show">Show answer<small>看答案</small></button></div>`);
    m.querySelector("#show").addEventListener("click", () => { SFX.tap(); openQ(i, "a"); });
  } else {
    m = modal(`${head}<div class="ans">${it.a}<span class="zh">${it.az}</span></div>
      <div class="acts"><button class="btn plain" id="back">◀ Back<small>回箱子</small></button><button class="btn no" id="wrong">Wrong ✗<small>答錯</small></button><button class="btn ok" id="right">Correct ✓<small>答對，打開箱子</small></button></div>`);
    m.querySelector("#right").addEventListener("click", () => reveal(i));
    m.querySelector("#wrong").addEventListener("click", () => { SFX.no(); g.cur = null; closeModal(); nextTurn(); mb(); });
  }
  m.querySelector("#back").addEventListener("click", () => { g.cur = null; closeModal(); });
}
function reveal(i) {
  const g = S.mb, [v, ic] = g.prizes[i], who = teamName(S.turn);
  g.open[i] = who; g.cur = null;
  addScore(S.turn, v);
  if (v > 0) { SFX.win(); confetti(); } else SFX.boo();
  const m = modal(`<div class="big" style="background:${v > 0 ? "var(--sun)" : "#b7e36b"}">${I(ic)}</div>
    <h3>Box ${i + 1}</h3>
    <div class="prize">${v > 0 ? "+" + v : v}<small>${v > 0 ? (v === 5 ? "大獎！" : "") + esc(who) + " 加 " + v + " 分" : "Shadow monster! " + esc(who) + " 扣 1 分"}</small></div>
    <div></div>
    <div class="acts"><button class="btn" id="cont">OK ▶<small>換下一隊</small></button></div>`);
  m.querySelector("#cont").addEventListener("click", () => { SFX.tap(); closeModal(); nextTurn(); mb(); });
}

// ===== End =====
function endScreen(which) {
  closeModal();
  const [a, b] = S.scores, n0 = esc(teamName(0)), n1 = esc(teamName(1));
  const title = a === b ? "It's a tie!" : (a > b ? n0 : n1) + " wins!";
  const sub = a === b ? "平手！兩隊都好棒！" : "恭喜 " + (a > b ? n0 : n1) + "！";
  view.innerHTML = `<div class="end"><div>
    <div class="trophy">${I("FaTrophy")}</div>
    <h2>${title}</h2>
    <p class="prompt" style="text-align:center"><span class="zh">${sub}　${n0} ${a} : ${b} ${n1}</span></p>
    <div class="opts" style="justify-content:center">
      <button class="btn" id="again" style="background:var(--mint)">Play again<small>再玩一次</small></button>
      <button class="btn plain" id="tomenu">Menu<small>回選單</small></button>
      <button class="btn no" id="reset">Reset scores<small>分數歸零</small></button>
    </div></div></div>`;
  SFX.win(); confetti();
  $("again").addEventListener("click", () => { if (which === "bos") S.bos = newBos(); else S.mb = newMb(); go(which); });
  $("tomenu").addEventListener("click", () => { if (which === "bos") S.bos = null; else S.mb = null; go("menu"); });
  const r = $("reset");
  r.addEventListener("click", () => {
    if (!r.dataset.armed) { r.dataset.armed = "1"; r.innerHTML = "Tap again<small>再點一次確認歸零</small>"; return; }
    S.scores = [0, 0]; renderScores(); r.innerHTML = "Done<small>已歸零</small>"; r.disabled = true;
  });
}

// ---------- boot (keeps scores across live updates) ----------
function start(data) {
  if (data && data.S) { S = Object.assign(S, data.S); if (data.names) data.names.forEach((n, t) => $("team" + t).value = n); }
  $("snd").innerHTML = I(S.sound ? "FaVolumeUp" : "FaVolumeMute");
  go(S.view || "menu");
}
window.claude?.hot?.snapshot?.(() => ({ S, names: [teamName(0), teamName(1)] }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
