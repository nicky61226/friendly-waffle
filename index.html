<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wonder World 遊戲盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: composition-notebook marble frame around one white sticker-panel stage; scoreboard bar on top; one game view at a time, full height for the whiteboard. Single deliberate light look. */
:root {
  --ink: #1f1f1f;
  --paper: #ffffff;
  --cream: #fff6da;
  --pink: #ff8fb8;  --pink-l: #ffd6e5;
  --mint: #6ed8b9;  --mint-l: #d3f5ea;
  --sun: #ffd43b;   --sun-l: #fff1b8;
  --lilac: #b49cff; --lilac-l: #e4dbff;
  --sky: #6ec3ff;   --sky-l: #d4eeff;
  --peach: #ffa470; --peach-l: #ffe0cc;
  --muted: #55525e;
  --bad: #e23d6d;
  --good: #0d8a64;
  --display: "Lilita One", "Baloo 2", "Noto Sans TC", system-ui, sans-serif;
  --body: "Baloo 2", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --zh: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: #e9e9e9 var(--marble, none) center / cover;
  color: var(--ink); font-family: var(--body); font-size: 18px;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
.frame { box-sizing: border-box; height: 100%; padding-inline: clamp(16px, 2.4vw, 30px); padding-block: clamp(12px, 2.2vw, 26px); display: flex; }
.stage { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--paper); border: 5px solid var(--ink); border-radius: 30px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; position: relative; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 20px 8px; }
.brand { font-family: var(--display); font-size: clamp(24px, 3vw, 36px); line-height: 1; display: flex; flex-wrap: wrap; }
.brand span { -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.teams { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.team { display: flex; align-items: center; gap: 8px; padding: 5px 8px 5px 12px; border: 3px solid var(--ink); border-radius: 18px; background: var(--paper); transition: transform .2s, box-shadow .2s; cursor: pointer; }
.team.on { transform: translateY(-3px); box-shadow: 0 5px 0 var(--ink); }
.team[data-t="0"].on { background: var(--sky-l); }
.team[data-t="1"].on { background: var(--pink-l); }
.team input { width: 5.4em; font: 800 19px var(--body); border: 0; background: transparent; color: var(--ink); padding: 0; }
.team input:focus-visible { outline: 3px dashed var(--ink); border-radius: 6px; }
.score { font-family: var(--display); font-size: 34px; min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
.score.pop { animation: pop .5s; }
.mini { width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); font: 900 18px var(--body); line-height: 1; }
.tools { display: flex; gap: 8px; }
.tool { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); background: var(--sun); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.tool svg { width: 20px; height: 20px; }
.tool.off { background: #e6e6e6; }
button:focus-visible { outline: 4px dashed var(--ink); outline-offset: 3px; }
.turn { font: 800 16px var(--body); padding: 0 22px; color: var(--muted); min-height: 1.3em; }
.turn b { color: var(--ink); }
.view { flex: 1; min-height: 0; overflow: auto; padding: 6px 20px 18px; display: flex; flex-direction: column; position: relative; }
.btn { font: 800 clamp(19px, 2.1vw, 26px) var(--body); color: var(--ink); border: 3.5px solid var(--ink); border-radius: 20px; padding: .4em 1em .32em; background: var(--sun); box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .12s, box-shadow .12s; line-height: 1.15; }
.btn small { display: block; font: 700 .6em var(--zh); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.plain { background: var(--paper); }
.btn.ok { background: var(--mint); }
.btn.no { background: var(--pink); }
.btn.t0 { background: var(--sky); }
.btn.t1 { background: var(--pink); }
.zh { font-family: var(--zh); }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 3.6vw, 44px); margin: 2px 0; text-wrap: balance; }
h2 .zh { font: 900 .5em var(--zh); color: var(--muted); margin-left: .4em; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 3px solid var(--ink); border-radius: 16px; overflow: hidden; }
.seg button { font: 800 16px var(--body); border: 0; background: var(--paper); padding: 6px 12px 4px; cursor: pointer; color: var(--ink); }
.seg button + button { border-left: 3px solid var(--ink); }
.seg button.on { background: var(--sun); }
.seg button small { font: 700 12px var(--zh); display: block; }
/* menu */
.units { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin: 4px 0 14px; }
.units .lab { font: 900 17px var(--zh); color: var(--muted); }
.chip { border: 3px solid var(--ink); border-radius: 18px; padding: 6px 14px 4px; background: var(--paper); cursor: pointer; font: 800 18px var(--body); color: var(--ink); text-align: left; display: flex; gap: 10px; align-items: center; }
.chip .ck { width: 22px; height: 22px; border-radius: 7px; border: 3px solid var(--ink); display: grid; place-items: center; font: 900 15px var(--body); background: var(--paper); }
.chip small { display: block; font: 700 13px var(--zh); color: var(--muted); }
.chip.on .ck { background: var(--ink); color: var(--paper); }
.chip.on[data-u="1"] { background: var(--sun-l); } .chip.on[data-u="2"] { background: var(--pink-l); } .chip.on[data-u="3"] { background: var(--sky-l); } .chip.on[data-u="4"] { background: var(--mint-l); }
.games { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; align-content: center; max-width: 1100px; width: 100%; margin: 0 auto; }
.gcard { border: 4px solid var(--ink); border-radius: 24px; padding: 18px; cursor: pointer; text-align: left; box-shadow: 0 7px 0 var(--ink); display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; font-family: var(--body); color: var(--ink); transition: transform .12s, box-shadow .12s; }
.gcard:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.gcard .ic { grid-row: span 2; width: 78px; height: 78px; border-radius: 50%; border: 3.5px solid var(--ink); background: var(--paper); display: grid; place-items: center; }
.gcard .ic svg { width: 52px; height: 52px; }
.gcard b { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.gcard span { font: 800 17px var(--zh); }
.gcard p { grid-column: 1 / -1; margin: 8px 0 0; font: 600 15px var(--zh); color: var(--muted); }
.hint { text-align: center; font: 600 14px var(--zh); color: var(--muted); margin-top: 12px; }
.warn { color: var(--bad); font: 800 15px var(--zh); }
/* picture tile */
.pic svg { width: 100%; height: 100%; display: block; }
/* balloon */
.sky { flex: 1; min-height: 300px; position: relative; overflow: hidden; border: 3.5px solid var(--ink); border-radius: 22px; background: linear-gradient(#d4eeff, #f4fbff); margin-top: 8px; touch-action: none; }
.cloud { position: absolute; background: var(--paper); border: 3px solid var(--ink); border-radius: 60px; opacity: .9; }
.balloon { position: absolute; left: 0; top: 0; width: 132px; height: 190px; cursor: pointer; will-change: transform; touch-action: none; }
.balloon .b { position: absolute; inset: 0 0 auto 0; height: 160px; }
.balloon .pic { position: absolute; left: 22px; top: 26px; width: 88px; height: 88px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); overflow: hidden; }
.balloon.popping { animation: popout .35s forwards; pointer-events: none; }
.balloon.shake .b, .balloon.shake .pic { animation: shake .4s; }
.prompt { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.say { width: 60px; height: 60px; border-radius: 50%; border: 3.5px solid var(--ink); background: var(--sun); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 var(--ink); padding: 0; color: var(--ink); }
.say svg { width: 28px; height: 28px; }
.target { font: 800 clamp(26px, 3.2vw, 40px) var(--body); }
.target .zh { font: 700 .5em var(--zh); color: var(--muted); margin-left: .4em; }
.hidden-word { letter-spacing: 6px; color: var(--muted); }
/* flash */
.flash { flex: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: center; min-height: 0; }
@media (max-width: 760px) { .flash { grid-template-columns: 1fr; } }
.fcard { position: relative; aspect-ratio: 1; max-height: 58vh; max-width: 100%; margin: 0 auto; width: 100%; border: 4px solid var(--ink); border-radius: 26px; background: var(--paper); overflow: hidden; box-shadow: 0 6px 0 var(--ink); }
.fcard .pic { position: absolute; inset: 8%; transition: filter .2s; }
.fcard .cover { position: absolute; inset: 0; background: var(--lilac); display: grid; place-items: center; font-family: var(--display); font-size: 90px; color: var(--paper); -webkit-text-stroke: 3px var(--ink); }
.tiles { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); }
.tile { border: 2px solid var(--ink); cursor: pointer; display: grid; place-items: center; font-family: var(--display); font-size: 30px; color: var(--ink); transition: transform .3s, opacity .3s; }
.tile.gone { transform: scale(0) rotate(30deg); opacity: 0; pointer-events: none; }
.answer { font: 800 clamp(36px, 4.6vw, 58px) var(--body); color: var(--good); line-height: 1.05; }
.answer .zh { display: block; font: 800 .45em var(--zh); color: var(--muted); }
.pattern { font: 700 21px var(--body); margin-top: 10px; padding: 10px 14px; border: 3px dashed var(--ink); border-radius: 16px; background: var(--sun-l); }
.ctrls { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
/* tug */
.tug { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 10px; }
.rope { position: relative; height: 92px; border: 3.5px solid var(--ink); border-radius: 22px; background: linear-gradient(90deg, var(--sky-l) 0 50%, var(--pink-l) 50% 100%); overflow: hidden; flex: none; }
.rope .line { position: absolute; left: 0; right: 0; top: 50%; height: 12px; margin-top: -6px; background: repeating-linear-gradient(45deg, #c9893c 0 10px, #a76a24 10px 20px); border-block: 2px solid var(--ink); }
.rope .mid { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 4px dashed var(--ink); }
.rope .goal { position: absolute; top: 0; bottom: 0; width: 4px; background: var(--ink); }
.rope .knot { position: absolute; left: 50%; top: 50%; width: 46px; height: 64px; margin: -40px 0 0 -23px; transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
.rope .end { position: absolute; top: 50%; transform: translateY(-50%); font-family: var(--display); font-size: 24px; padding: 4px 12px; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sides { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; min-height: 0; }
.side { border: 3.5px solid var(--ink); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; position: relative; touch-action: manipulation; min-width: 0; }
.side[data-t="0"] { background: var(--sky-l); } .side[data-t="1"] { background: var(--pink-l); }
.side .ask { font: 800 clamp(26px, 3.6vw, 46px) var(--body); text-align: center; min-height: 1.2em; }
.side .askpic { width: clamp(90px, 14vw, 150px); height: clamp(90px, 14vw, 150px); border: 3px solid var(--ink); border-radius: 18px; background: var(--paper); }
.side .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.opt { border: 3.5px solid var(--ink); border-radius: 18px; background: var(--paper); box-shadow: 0 4px 0 var(--ink); cursor: pointer; padding: 6px; display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; font: 800 clamp(18px, 2.2vw, 28px) var(--body); color: var(--ink); touch-action: manipulation; }
.opt.word { aspect-ratio: auto; min-height: 76px; }
.opt .pic { width: 100%; height: 100%; }
.opt.bad { background: #ffc2d1; animation: shake .4s; }
.opt.good { background: var(--mint); }
.side.locked::after { content: "Wait…"; position: absolute; inset: 0; border-radius: 19px; background: rgba(255,255,255,.65); display: grid; place-items: center; font-family: var(--display); font-size: 40px; color: var(--bad); }
.side .sc { position: absolute; top: 8px; left: 12px; font: 800 15px var(--body); color: var(--muted); }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(31,31,31,.45); z-index: 4; font-family: var(--display); font-size: 140px; color: var(--sun); -webkit-text-stroke: 5px var(--ink); }
/* memory */
.mem { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px); min-height: 300px; margin-top: 8px; perspective: 900px; }
.mcard { position: relative; cursor: pointer; border: 0; padding: 0; background: none; min-height: 0; }
.mcard .in { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .face { position: absolute; inset: 0; border: 3.5px solid var(--ink); border-radius: 18px; backface-visibility: hidden; display: grid; place-items: center; overflow: hidden; }
.mcard .back { background: var(--lilac) radial-gradient(circle at 30% 30%, rgba(255,255,255,.35) 0 18%, transparent 19%) ; box-shadow: 0 5px 0 var(--ink); font-family: var(--display); font-size: clamp(30px, 4vw, 54px); color: var(--paper); -webkit-text-stroke: 2.5px var(--ink); }
.mcard .front { background: var(--paper); transform: rotateY(180deg); font: 800 clamp(20px, 2.6vw, 34px) var(--body); padding: 6px; text-align: center; }
.mcard .front .pic { width: 86%; height: 86%; }
.mcard.done .front { background: var(--mint-l); }
.mcard.done .front::after { content: attr(data-who); position: absolute; bottom: 4px; right: 8px; font: 800 12px var(--body); color: var(--muted); }
/* overlays */
.modal { position: absolute; inset: 0; background: rgba(31,31,31,.5); display: grid; place-items: center; padding: 20px; z-index: 6; }
.mbox { background: var(--paper); border: 5px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); padding: 26px 30px; text-align: center; max-width: 640px; width: 100%; box-sizing: border-box; animation: pop .35s; }
.mbox h2 { font-size: clamp(34px, 5vw, 56px); }
.mbox p { font: 700 18px var(--zh); color: var(--muted); }
.trophy { width: 120px; height: 120px; margin: 0 auto 8px; border-radius: 50%; border: 4px solid var(--ink); background: var(--sun); display: grid; place-items: center; }
.trophy svg { width: 60px; height: 60px; }
canvas#fx { position: absolute; inset: 0; pointer-events: none; z-index: 9; width: 100%; height: 100%; }
.banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 8; pointer-events: none; font-family: var(--display); font-size: clamp(32px, 4.6vw, 58px); padding: 10px 30px; border: 5px solid var(--ink); border-radius: 26px; box-shadow: 0 7px 0 var(--ink); white-space: nowrap; animation: bannerIn 1.3s both; }
.start { position: absolute; inset: 0; z-index: 10; background: rgba(255,255,255,.86); display: grid; place-items: center; text-align: center; }
.start .btn { font-size: 40px; padding: .4em 1.4em .3em; }
.start p { font: 700 17px var(--zh); color: var(--muted); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes popout { to { transform: var(--t) scale(1.6); opacity: 0; } }
@keyframes shake { 0%,100% { translate: 0; } 25% { translate: -9px; } 75% { translate: 9px; } }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 15%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
@media (max-width: 640px) { .bar { padding: 10px 12px 6px; } .view { padding: 6px 12px 14px; } .team input { width: 4em; font-size: 16px; } .score { font-size: 28px; } .sides { grid-template-columns: 1fr; } .mem { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(70px, 1fr)); } }
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div class="frame">
  <div class="stage" id="stage">
    <div class="bar">
      <div class="brand" id="brand" aria-label="Wonder Games"></div>
      <div class="teams">
        <div class="team on" data-t="0">
          <input id="team0" value="Team 1" aria-label="第一隊名稱" maxlength="10">
          <button class="mini" data-adj="0,-1" aria-label="第一隊減一分">−</button>
          <span class="score" id="score0">0</span>
          <button class="mini" data-adj="0,1" aria-label="第一隊加一分">+</button>
        </div>
        <div class="team" data-t="1">
          <input id="team1" value="Team 2" aria-label="第二隊名稱" maxlength="10">
          <button class="mini" data-adj="1,-1" aria-label="第二隊減一分">−</button>
          <span class="score" id="score1">0</span>
          <button class="mini" data-adj="1,1" aria-label="第二隊加一分">+</button>
        </div>
      </div>
      <div class="tools">
        <button class="tool" id="home" aria-label="回選單"></button>
        <button class="tool" id="mus" aria-label="背景音樂開關"></button>
        <button class="tool" id="snd" aria-label="音效開關"></button>
        <button class="tool" id="fs" aria-label="全螢幕"></button>
      </div>
    </div>
    <div class="turn" id="turn"></div>
    <div class="view" id="view"></div>
    <canvas id="fx"></canvas>
    <div class="start" id="start">
      <div>
        <button class="btn" id="go">Start ▶<small>點我開始（音樂會一起開始）</small></button>
        <p>瀏覽器規定要先點一下才能播放聲音。</p>
      </div>
    </div>
  </div>
</div>

// ---------- marble frame ----------
(function marble() {
  try {
    const W = 960, H = 600, c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d"), acc = new Float32Array(W * H);
    [[12, .5], [26, 1], [52, .6]].forEach(([sc, wt]) => {
      const sw = Math.ceil(W / sc) + 2, sh = Math.ceil(H / sc) + 2, s = document.createElement("canvas"); s.width = sw; s.height = sh;
      const sg = s.getContext("2d"), id = sg.createImageData(sw, sh);
      for (let i = 0; i < sw * sh; i++) { const v = Math.random() * 255; id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v; id.data[i*4+3] = 255; }
      sg.putImageData(id, 0, 0); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high"; g.drawImage(s, -sc, -sc, sw * sc, sh * sc);
      const d = g.getImageData(0, 0, W, H).data; for (let i = 0; i < W * H; i++) acc[i] += d[i*4] / 255 * wt;
    });
    const t = Float32Array.from(acc).sort()[Math.floor(W * H / 2)], out = g.createImageData(W, H);
    for (let i = 0; i < W * H; i++) { const v = acc[i] > t ? 30 : 255; out.data[i*4] = out.data[i*4+1] = out.data[i*4+2] = v; out.data[i*4+3] = 255; }
    g.putImageData(out, 0, 0); document.body.style.setProperty("--marble", `url(${c.toDataURL()})`);
  } catch (e) {}
})();

    s += `<circle cx="${x}" cy="${y}" r="7" fill="${i < n ? RAIN[(n - 1) % 6] : "#ffffff"}" ${K}/>`;
  }
  return svg(s);
}

let S = { scores: [0, 0], turn: 0, music: true, sound: true, view: "menu", units: [1, 2, 3, 4], opts: { balloon: "both", flash: "blur", tug: "word" } };
try { const saved = JSON.parse(localStorage.getItem("ww1-prefs") || "null"); if (saved) { if (Array.isArray(saved.units) && saved.units.length) S.units = saved.units; if (saved.opts) Object.assign(S.opts, saved.opts); } } catch (e) {}
function savePrefs() { try { localStorage.setItem("ww1-prefs", JSON.stringify({ units: S.units, opts: S.opts })); } catch (e) {} }
const pool = () => WORDS.filter(w => S.units.includes(w.u));
function teamName(t) { return ($("team" + t).value || "Team " + (t + 1)).trim(); }
function renderScores(popT) {
  [0, 1].forEach(t => { const el = $("score" + t); el.textContent = S.scores[t]; if (t === popT) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); } });
  document.querySelectorAll(".team").forEach(el => el.classList.toggle("on", +el.dataset.t === S.turn));
  $("turn").innerHTML = S.view === "menu" ? "先勾單元，再選遊戲。隊名可以點一下修改。" : S.view === "tug" ? "兩隊同時上台，各自在自己那一邊作答。" : `Now playing 輪到：<b>${esc(teamName(S.turn))}</b>`;
}
function addScore(t, n) { S.scores[t] += n; renderScores(t); }
function nextTurn(quiet) { S.turn = 1 - S.turn; renderScores(); if (!quiet) banner(teamName(S.turn) + "!", S.turn ? "var(--pink)" : "var(--sky)"); }

[0, 1].forEach(t => $("team" + t).addEventListener("input", () => renderScores()));
document.querySelectorAll(".team").forEach(el => el.addEventListener("click", e => { if (e.target.closest("button,input")) return; S.turn = +el.dataset.t; renderScores(); }));

let AC = null, master = null, musicGain = null;
function ac() {
  if (!AC) {

    const el = document.createElement("div"); el.className = "balloon";

        <div class="knot" id="knot"><svg viewBox="0 0 46 64"><path d="M23 6 V60" stroke="#1f1f1f" stroke-width="4"/><path d="M23 6 L44 14 L23 24z" fill="#ff6fa5" stroke="#1f1f1f" stroke-width="3" stroke-linejoin="round"/><circle cx="23" cy="40" r="9" fill="#ffd43b" stroke="#1f1f1f" stroke-width="3"/></svg></div></div>
      <div class="sides">
        <div class="side" data-t="0" id="side0"><span class="sc">${esc(teamName(0))}</span></div>
        <div class="side" data-t="1" id="side1"><span class="sc">${esc(teamName(1))}</span></div>
      </div>
    </div>`;
  bindSeg(tug);
  function knot() {
    const rope = $("rope"), span = rope.clientWidth * .42;
    $("knot").style.transform = `translateX(${(-pos / GOAL) * span}px)`;
  }
  function ask(t) {
    const side = $("side" + t), ans = pick(P, 1, q[t] && q[t].ans)[0];
    const opts = shuffle([ans, ...pick(P, Math.min(2, P.length - 1), ans)]);
    q[t] = { ans, opts };
    const mode = S.opts.tug;
    side.innerHTML = `<span class="sc">${esc(teamName(t))}</span>` + (mode === "word"
      ? `<div class="ask">${esc(ans.w)}</div><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}" aria-label="option ${k + 1}"><div class="pic">${o.pic()}</div></button>`).join("")}</div>`
      : `<div class="askpic pic">${ans.pic()}</div><div class="opts">${opts.map((o, k) => `<button class="opt word" data-k="${k}">${esc(o.w)}</button>`).join("")}</div>`);
    side.querySelectorAll(".opt").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); answer(t, +b.dataset.k, b); }));
  }
  function answer(t, k, b) {
    if (!live || Date.now() < lock[t]) return;
    const qq = q[t];
    if (qq.opts[k] === qq.ans) {
      b.classList.add("good"); SFX.ok();
      pos += t === 0 ? 1 : -1; knot();
      if (Math.abs(pos) >= GOAL) return finish(t);
      timers.push(setTimeout(() => ask(t), 260));
    } else {
      b.classList.add("bad"); SFX.no(); lock[t] = Date.now() + 1300;
      const side = $("side" + t); side.classList.add("locked");
      timers.push(setTimeout(() => { side.classList.remove("locked"); ask(t); }, 1300));
    }
  }
  function finish(t) {
    live = false; addScore(t, 3);
    const r = $("stage").getBoundingClientRect(); confetti(t === 0 ? r.width * .25 : r.width * .75);
    winner(teamName(t) + " wins! +3", tug);
  }
  function countdown() {
    const cd = document.createElement("div"); cd.className = "countdown"; view.appendChild(cd);
    let n = 3; const tick = () => {
      if (n === 0) { cd.textContent = "GO!"; tone([[880, .3]]); timers.push(setTimeout(() => { cd.remove(); live = true; ask(0); ask(1); }, 500)); return; }
      cd.textContent = n; tone([[440, .15]]); n--; timers.push(setTimeout(tick, 750));
    };
    tick();
  }
  ["side0", "side1"].forEach((id, t) => { $(id).innerHTML += `<div class="target" style="text-align:center">Ready?<span class="zh" style="display:block">按上面的 Start 開始</span></div>`; });
  $("startTug").addEventListener("click", () => { timers.forEach(clearTimeout); pos = 0; knot(); live = false; SFX.tap(); countdown(); });
  requestAnimationFrame(knot);
  const onResize = () => knot(); addEventListener("resize", onResize);
  cleanup = () => { timers.forEach(clearTimeout); live = false; removeEventListener("resize", onResize); };
}

// ---------- Game 4: Memory ----------
function memory() {
  const P = pool(), n = Math.min(6, P.length), words = pick(P, n);
  const cards = shuffle(words.flatMap(w => [{ w, kind: "pic" }, { w, kind: "word" }]));
  let up = [], busy = false, found = 0;
  const cols = cards.length <= 8 ? 4 : 4;
  view.innerHTML = `
    <div class="row"><h2>Memory<span class="zh">翻翻樂</span></h2><span class="target" style="font-size:20px" id="left">${n} pairs 對</span></div>
    <div class="mem" id="mem" style="grid-template-rows:repeat(${Math.ceil(cards.length / cols)}, minmax(0, 1fr))">${cards.map((c, k) => `
      <button class="mcard" data-k="${k}" aria-label="card ${k + 1}"><div class="in">
        <div class="face back">${k + 1}</div>
        <div class="face front">${c.kind === "pic" ? `<div class="pic">${c.w.pic()}</div>` : esc(c.w.w)}</div>
      </div></button>`).join("")}</div>`;
  view.querySelectorAll(".mcard").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); flipCard(b); }));
  function flipCard(b) {
    if (busy || b.classList.contains("up") || b.classList.contains("done")) return;
    b.classList.add("up"); SFX.flip(); up.push(b);
    if (up.length < 2) return;
    busy = true;
    const [a, c] = up, A = cards[+a.dataset.k], C = cards[+c.dataset.k];
    if (A.w === C.w && A.kind !== C.kind) {
      setTimeout(() => {
        [a, c].forEach(x => { x.classList.add("done"); x.querySelector(".front").dataset.who = teamName(S.turn); });
        SFX.ok(); speak(A.w.say); addScore(S.turn, 1); found++;
        $("left").textContent = `${n - found} pairs 對`;
        up = []; busy = false;
        if (found === n) { const [x, y] = S.scores; setTimeout(() => winner(x === y ? "It's a tie!" : (x > y ? teamName(0) : teamName(1)) + " wins!", memory), 700); }
        else banner("Again! 再翻一次", "var(--mint)");
      }, 450);
    } else {
      setTimeout(() => { SFX.no(); }, 350);
      setTimeout(() => { a.classList.remove("up"); c.classList.remove("up"); up = []; busy = false; nextTurn(); }, 1300);
    }
  }
  cleanup = () => {};
}

// ---------- boot ----------
function start(data) {
  if (data && data.S) { const d = data.S; S.scores = d.scores || S.scores; S.turn = d.turn || 0; S.units = d.units || S.units; S.opts = Object.assign(S.opts, d.opts || {}); if (data.names) data.names.forEach((nm, t) => $("team" + t).value = nm); if (data.started) $("start").hidden = true; }
  $("mus").classList.toggle("off", !S.music);
  go("menu");
}
window.claude?.hot?.snapshot?.(() => ({ S: { scores: S.scores, turn: S.turn, units: S.units, opts: S.opts }, names: [teamName(0), teamName(1)], started: $("start").hidden }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
